name: nexo-db-backup

# Scheduled daily backup of the Neon Postgres database to Azure Blob Storage.
# All credentials are referenced from GitHub Actions secrets — never literal.

on:
  schedule:
    # Daily at 06:00 UTC.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.AZURE_STORAGE_CONNECTION_STRING }}
      BACKUP_CONTAINER: nexo-db-backups
    steps:
      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Dump and compress Neon database
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          BACKUP_FILE="nexo-backup-${TIMESTAMP}.sql.gz"
          echo "BACKUP_FILE=${BACKUP_FILE}" >> "$GITHUB_ENV"
          pg_dump "$NEON_DATABASE_URL" | gzip > "$BACKUP_FILE"
          ls -lh "$BACKUP_FILE"

      - name: Upload to Azure Blob Storage
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob upload \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --container-name "$BACKUP_CONTAINER" \
              --name "$BACKUP_FILE" \
              --file "$BACKUP_FILE" \
              --overwrite true

      - name: Prune backups older than 7 days
        uses: azure/CLI@v2
        with:
          inlineScript: |
            cutoff=$(date -u -d '7 days ago' +%Y-%m-%dT%H:%M:%SZ)
            blobs=$(az storage blob list \
              --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
              --container-name "$BACKUP_CONTAINER" \
              --query "[?properties.creationTime < '$cutoff'].name" -o tsv)
            for blob in $blobs; do
              echo "Deleting old backup: $blob"
              az storage blob delete \
                --connection-string "$AZURE_STORAGE_CONNECTION_STRING" \
                --container-name "$BACKUP_CONTAINER" \
                --name "$blob"
            done

      - name: Alert on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 Nexo DB backup failed on ${new Date().toISOString()}`,
              body: `The scheduled Neon → Azure Blob backup workflow failed.\n\nWorkflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['backup', 'incident', 'ci']
            });
